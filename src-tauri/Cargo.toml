[package]
name = "deskclock"
version = "0.1.0"
description = "DeskClock — registro de horas trabalhadas"
authors = []
edition = "2021"
rust-version = "1.88"

[lib]
name = "deskclock_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Dependência direta para migrar do Rust, no boot, antes de o frontend conectar.
# Mesma versão que o tauri-plugin-sql resolve — o cargo unifica as duas.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-streamable-http-server"] }

[dev-dependencies]
# `ServiceExt::oneshot` para o teste de roteamento da API local.
tower = { version = "0.5", features = ["util"] }
