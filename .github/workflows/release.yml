name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Criar como rascunho?'
        type: boolean
        default: true

jobs:
  build:
    name: Build — ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux
          - platform: windows-latest
            label: Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar CHANGELOG com o branch principal
        run: git fetch origin main && git checkout origin/main -- CHANGELOG.md

      # ── Dependências do sistema (Linux) ────────────────────────────────
      - name: Instalar dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libayatana-appindicator3-dev

      # ── Node + pnpm ────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ── Rust ───────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Instalar dependências JS ───────────────────────────────────────
      - run: pnpm install

      # ── Testes antes de buildar ────────────────────────────────────────
      - run: pnpm tsc --noEmit
      - run: pnpm test

      # ── Extrair notas de versão do CHANGELOG.md ───────────────────────
      - name: Extrair notas de versão
        id: changelog
        shell: node {0}
        run: |
          const fs = require('fs');
          const version = process.env.TAG.replace(/^v/, '');
          const escapedVersion = version.replace(/\./g, '\\.');
          const versionHeader = new RegExp(`^#{2,3} \\[${escapedVersion}\\]`);
          const nextHeader = /^#{2,3} \[/;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
          let inSection = false;
          const notes = [];
          for (const line of lines) {
            if (versionHeader.test(line)) { inSection = true; continue; }
            if (inSection && nextHeader.test(line)) break;
            if (inSection) notes.push(line);
          }
          const trimmed = notes.join('\n').trim();
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `notes<<EOF\n${trimmed}\nEOF\n`);
        env:
          TAG: ${{ github.ref_name }}

      # ── Build Tauri + publicar release ────────────────────────────────
      - uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          # `vars`, não `secrets`: id de board não é segredo, é configuração de
          # conta. O que se quer é mantê-los fora do código-fonte de um
          # repositório público, e Variables já entrega isso — usar Secrets aqui
          # só diria a quem lê que existe algo a proteger que não existe.
          # Ausentes, o build passa e o app abre com os campos do Monday vazios.
          MONDAY_PORTFOLIO_BOARD_ID: ${{ vars.MONDAY_PORTFOLIO_BOARD_ID }}
          MONDAY_REPORT_BOARD_ID: ${{ vars.MONDAY_REPORT_BOARD_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DeskClock ${{ github.ref_name }}'
          releaseBody: |
            ## DeskClock ${{ github.ref_name }}

            ${{ steps.changelog.outputs.notes }}

            ---

            ### Instalação

            | Plataforma | Arquivo |
            |---|---|
            | Windows | `.msi` ou `.exe` (NSIS) |
            | Ubuntu / Debian | `.deb` |
            | Linux (universal) | `.AppImage` |

            Consulte o [README](https://github.com/${{ github.repository }}#build) para instruções detalhadas.
          releaseDraft: ${{ github.event.inputs.draft || 'true' }}
          prerelease: false
          updaterJsonPreferNsis: true