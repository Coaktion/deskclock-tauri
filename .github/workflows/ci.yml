name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes e type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install
      - run: pnpm tsc --noEmit
      - run: pnpm test
      - run: pnpm lint

      # Por último de propósito: os passos param no primeiro que falha, e um
      # arquivo desalinhado escondendo um teste quebrado inverteria a ordem de
      # importância do que a execução tem a dizer. Falhando aqui, `pnpm format`
      # resolve.
      - run: pnpm format:check
